# Refresh Admin Discovery queue from library calendars (PA + Los Altos + MV).
# Manual only for now — enable schedule after verifying Admin → Discovery.

name: Discover bay area libraries

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Look-ahead window (days)'
        required: false
        default: '60'
        type: string

permissions:
  contents: write

concurrency:
  group: discover-bay-area
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape library calendars
        run: npm run discover:bay-area -- --days=${{ inputs.days || '60' }}

      - name: Verify build
        run: npm run build

      - name: Commit discovery queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/discovery-candidates.json data/discovery/bay-area-*.json
          if git diff --staged --quiet; then
            echo "No discovery changes — skipping commit."
          else
            git commit -m "chore: refresh discovery queue (bay area, ${{ inputs.days || '60' }} days)"
            git push
          fi
