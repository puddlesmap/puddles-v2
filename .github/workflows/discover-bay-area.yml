# Refresh Admin Discovery queue from library calendars (PA + Los Altos + MV).
# Sunday cron: 2–3 month look-ahead for Admin → Discovery review (no auto-publish).
# Manual FIT4MOM schedule check stays a Monday reminder in the job log when run via schedule.

name: Discover bay area libraries

on:
  schedule:
    # Sundays 15:00 UTC ≈ 8:00 AM Pacific
    - cron: '0 15 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: 'Look-ahead window (days) — use 90 for 2–3 months'
        required: false
        default: '90'
        type: string

permissions:
  contents: write

concurrency:
  group: discover-bay-area
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape library calendars
        run: npm run discover:bay-area -- --days=${{ inputs.days || '90' }}

      - name: Reminder — FIT4MOM schedule check
        if: github.event_name == 'schedule'
        run: |
          echo "::notice title=FIT4MOM schedule check::Re-verify https://sunnyvale.fit4mom.com/schedule. Update Calendar Watchlist · FIT4MOM rows in Admin Discovery if times changed."

      - name: Expansion lookahead report
        run: npm run discover:expansion-lookahead -- --days=${{ inputs.days || '90' }}

      - name: Verify build
        run: npm run build

      - name: Commit discovery queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/discovery-candidates.json data/discovery/bay-area-*.json data/discovery/expansion-lookahead-*.json docs/calendar-watchlist-next-2-months.md
          if git diff --staged --quiet; then
            echo "No discovery changes — skipping commit."
          else
            git commit -m "chore: refresh discovery queue (bay area, ${{ inputs.days || '90' }} days)"
            git push
          fi
